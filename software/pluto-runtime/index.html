<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pluto — runtime</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Pluto</h1>
    <div id="midiStatus" class="status">MIDI: inizializzazione…</div>
  </header>

  <main id="stage">
    <!-- Un riquadro per ogni canale configurato: si illumina quando l'oggetto fisico viene attivato.
         Pensato come primo feedback visivo per il paziente/l'educatore; i colori vengono da config/mapping.json -->
  </main>

  <footer>
    <p>
      <strong>Modalita' test da tastiera</strong> (finche' non e' collegato l'eobody III):
      tasti <kbd>1</kbd>–<kbd>0</kbd> = Raggio 1, <kbd>Q</kbd>/<kbd>W</kbd> = Tavolette.
      Clicca prima sulla pagina per attivare l'audio del browser.
    </p>
    <p class="hint">Mappatura suoni: <code>config/mapping.js</code> — modificabile senza toccare il codice.</p>
  </footer>

  <script src="config/mapping.js"></script>
  <script src="app.js"></script>
</body>
</html>
