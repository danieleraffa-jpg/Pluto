<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pluto — editor preset</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FAF6EF'/%3E%3Cellipse cx='54' cy='54' rx='34' ry='9' fill='none' stroke='%23E8A33D' stroke-width='7' transform='rotate(-20 54 54)'/%3E%3Ccircle cx='54' cy='54' r='21' fill='%237C4FD6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="editor.css" />
</head>
<body class="editor-body">

  <!--
    Pagina pensata per il musicista, non per l'educatore: niente link verso
    qui dall'app principale (index.html). Protetta da un PIN semplice (vedi
    editor.js) — un deterrente contro l'apertura per sbaglio, non una vera
    sicurezza: e' tutto statico, senza server, quindi aggirabile da chi
    legge il codice sorgente.
  -->
  <div id="lockScreen" class="lock-screen">
    <div class="lock-box">
      <h1>
        <svg class="title-mark" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="54" cy="54" rx="34" ry="9" fill="none" stroke="#E8A33D" stroke-width="7" transform="rotate(-20 54 54)" />
          <circle cx="54" cy="54" r="21" fill="#7C4FD6" />
        </svg>
        Editor preset
      </h1>
      <p class="hint">Area riservata a chi prepara i suoni. Inserisci il PIN.</p>
      <input type="password" id="pinInput" inputmode="text" autocomplete="off" placeholder="PIN" />
      <button id="pinSubmit" class="status-button">Entra</button>
      <p id="pinError" class="lock-error"></p>
    </div>
  </div>

  <div id="editorApp" class="editor-app" hidden>
    <header>
      <h1>
        <svg class="title-mark" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="54" cy="54" rx="34" ry="9" fill="none" stroke="#E8A33D" stroke-width="7" transform="rotate(-20 54 54)" />
          <circle cx="54" cy="54" r="21" fill="#7C4FD6" />
        </svg>
        Editor preset
      </h1>
      <div class="status-group">
        <label class="preset-picker">
          <span class="preset-picker__label">Preset</span>
          <select id="presetSelect" aria-label="Preset in modifica"></select>
        </label>
        <button id="presetDuplicate" class="status-button">Duplica</button>
        <button id="presetRename" class="status-button">Rinomina</button>
        <button id="presetDelete" class="status-button status-button--warn">Elimina</button>
        <button id="presetSetDefault" class="status-button status-button--ghost">Imposta come default</button>
        <a href="index.html" class="status-button status-button--ghost">← Torna a Pluto</a>
      </div>
    </header>

    <div class="editor-layout">
      <nav id="channelTabs" class="channel-tabs" aria-label="Canali del preset"></nav>

      <section id="channelForm" class="channel-form"></section>
    </div>

    <footer class="editor-footer">
      <button id="saveButton" class="status-button status-button--active">Salva su config/mapping.js</button>
      <span id="saveStatus" class="hint"></span>
    </footer>
  </div>

  <script src="config/mapping.js"></script>
  <script src="editor.js"></script>
</body>
</html>
